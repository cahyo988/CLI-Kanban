<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="kanban-token" content="__KANBAN_TOKEN__">
  <title>Claude Kanban</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c96442'/%3E%3Crect x='7' y='8' width='5' height='16' rx='1.5' fill='%23fff'/%3E%3Crect x='13.5' y='8' width='5' height='11' rx='1.5' fill='%23fff' opacity='.8'/%3E%3Crect x='20' y='8' width='5' height='7' rx='1.5' fill='%23fff' opacity='.6'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong colours.
    try { var t = JSON.parse(localStorage.getItem('ck.ui') || '{}').theme; } catch (e) {}
    var q = location.search.match(/[?&]theme=(light|dark)\b/);
    if (q) t = q[1];
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  </script>
  <link rel="stylesheet" href="/style.css">
  <!-- Three.js is vendored (MIT, public/vendor/three) and only fetched when the 3D view opens. -->
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-label="Detail" id="drawer-panel"></section>
  </div>

  <div id="modal" class="modal" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
